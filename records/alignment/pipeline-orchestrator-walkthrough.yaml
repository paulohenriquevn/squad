title: The pipeline orchestrator
subtitle: >-
  Many items in flight, one stage each. Watch step 3 of the primary flow — the
  item that halts does not stop the line, and that is the whole point.
direction: LR

nodes:
  backlog:  { label: BACKLOG.md,     kind: store }
  workflow: { label: pipeline,       kind: service }
  judge:    { label: judge agent,    kind: actor }
  lane:     { label: lane worktree,  kind: service }
  review:   { label: REVIEW fan-out, kind: service }
  pr:       { label: release PR,     kind: external }

flows:
  "Three items in flight [primary]":
    - from: backlog
      to: workflow
      label: 3 triaged items
      payload: B-014 · B-022 · B-033
      note: >-
        One consumer has 22 of these waiting. Today they are worked in sequence
        and every phase is idle whenever it is not the current one.
    - from: workflow
      to: lane
      label: 3 lanes, not 8
      payload: min(16, cpus-2)=10 · REVIEW fans out 5-7
      note: >-
        The first draft said 8 and the judge refused it. 8 lanes with one in
        REVIEW needs 8+7=15 against a cap of 10 — it deadlocks on the very limit
        it cited. Reserving one review's fan-out leaves 10-7=3.
    - from: lane
      to: judge
      label: B-022 needs sign-off
      payload: brief at 94%, boxes unticked
      note: >-
        Readers expect the line to stop here. It does not. Only B-022 waits; B-014
        and B-033 keep moving, which is why the pipeline is worth building at all.
    - from: judge
      to: lane
      label: signs or refuses
      payload: verdict written into the brief
      note: >-
        The judge reads the item's EVIDENCE, not just the brief. It must be able
        to refuse, or it is a rubber stamp with extra latency.
    - from: lane
      to: pr
      label: B-014 reaches release
      payload: while B-022 is still with the judge
      note: The throughput is over ITEMS, not over the phases of one item.

  "One item parked, line moves [alternate]":
    - from: lane
      to: judge
      label: B-022 alignment
      payload: brief at 71%
    - from: judge
      to: workflow
      label: REFUSED — gaps named
      payload: nfr_measurable, interaction_model
      note: >-
        A refusal is not a failure of the pipeline. It is the gate doing the one
        thing it exists for, on one item, without touching the other two.
    - from: workflow
      to: lane
      label: B-014 and B-033 advance
      note: The parked item costs one lane, not the line.

  "REVIEW sends work back [alternate2]":
    - from: lane
      to: review
      label: B-014 enters REVIEW
      payload: holds a whole lane — 5-7 reviewers
      note: >-
        REVIEW is the one stage that fans out, so it occupies a lane by itself.
        Two concurrent reviews need 14 agents against a cap of 10.
    - from: review
      to: lane
      label: merge-only handoff back
      payload: back-one, carries a commit not a task
      note: >-
        Backward propagation — the third thing parallelism-shapes.md says the
        pipeline needs, and the one the first draft of this brief forgot. The
        judge caught its absence. Upstream MERGES it; it is not new work.

  "A stage fails [exception]":
    - from: lane
      to: judge
      label: /implement returned FAIL
      payload: validation gate red
      note: >-
        One retry, then PARK AND SURFACE. cycle-idea-to-release:80 halts and asks
        the HUMAN here; an earlier draft swapped in a judge without saying so.
        That substitution is now CHK004's subject, not a detail in a flow.
    - from: judge
      to: workflow
      label: park with the verdict
      payload: no other item affected
    - from: workflow
      to: lane
      label: the other lanes continue

  "The run is interrupted [recovery]":
    - from: workflow
      to: backlog
      label: state lives on disk
      payload: queue + per-item lane
      note: >-
        The Workflow tool resumes by runId, but the ITEM state must outlive the
        process too — otherwise a restart re-runs work that already landed.
    - from: backlog
      to: workflow
      label: resume from the queue
      payload: orphan worktrees reclaimed first
      note: >-
        A worktree left behind by a killed run is indistinguishable from a live
        one. Reclaim before starting anything new, or the next run inherits a
        dirty tree — the defect isolation exists to prevent.
    - from: workflow
      to: lane
      label: the line restarts
