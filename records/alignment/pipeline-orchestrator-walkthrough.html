  THE ANIMATION, AND WHY THESE THREE THINGS TOGETHER
  A dot travelling along a line says "something moved". Three coordinated things
  say what moved, where from, and what it did on arrival:

    3. the destination ANSWERS — a pulse delayed by the travel time

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Travel time scales with distance, floored and capped: a short hop that takes
 *  as long as a long one reads as a stall, and a long one at the short one's
 *  speed is a blur. */
const duration = len => Math.max(420, Math.min(1500, len * 2.1));

let flowIndex = 0, step = 0, timer = null;
let wires = [];   // { path, packet, label, num, len }

const el = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

function buildStage() {
  svg.innerHTML = "";
  // Graphviz's own bounding box, plus a margin so strokes and labels at the
  // edge are not clipped by the viewBox.
  const M = 14;
  svg.setAttribute("viewBox", `${-M} ${-M} ${DATA.width + M * 2} ${DATA.height + M * 2}`);
  // No fixed height and no viewport cap: the viewBox carries the aspect
  // ratio, so the stage fills its column and the type stays at the size the
  // layout chose. A `max-height` shrinks the whole drawing to fit, which is
  // how 12.5px labels ended up unreadable.
  svg.style.aspectRatio = `${DATA.width + M * 2} / ${DATA.height + M * 2}`;

  const defs = el("defs");
  defs.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
             markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
       <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
     </marker>`;
  svg.appendChild(defs);

  const wireLayer = el("g", { id: "wires" });
  const nodeLayer = el("g", { id: "nodes" });
  svg.append(wireLayer, nodeLayer);

  for (const [id, n] of Object.entries(DATA.nodes)) {
    const g = el("g", { class: "node", id: "node-" + id, "data-kind": n.kind });
    const x = n.x - n.w / 2, y = n.y - n.h / 2;
    // The halo sits behind and scales about the node's own centre, so the pulse
    // grows outward rather than drifting toward the origin.
    g.appendChild(el("rect", {
      class: "halo", x, y, width: n.w, height: n.h, rx: 9,
      style: `transform-box: fill-box; transform-origin: center;`,
    }));
    g.appendChild(el("rect", { class: "node-box", x, y, width: n.w, height: n.h, rx: 9 }));
    const label = el("text", {
      class: "node-label", x: n.x, y: n.y - 1, "text-anchor": "middle",
    });
    label.textContent = n.label;
    const kind = el("text", {
      class: "node-kind", x: n.x, y: n.y + 12, "text-anchor": "middle",
    });
    kind.textContent = n.kind;
    g.append(label, kind);
    nodeLayer.appendChild(g);
  }
  return wireLayer;
}

function buildWires(wireLayer) {
  wireLayer.innerHTML = "";
  wires = [];
  DATA.flows[flowIndex].steps.forEach((s, i) => {
    const path = el("path", { class: "wire", d: s.d, "marker-end": "url(#ah)" });
    wireLayer.appendChild(path);
    const len = path.getTotalLength();
    // Graphviz placed the label and handed back `lp`, having reserved room for
    // it during layout. Falling back to the curve's midpoint is what the first
    // version did everywhere, and it is what put "write brief" on top of the
    // Reviewer box — the midpoint of a curve is not a free spot, it is just a
    // spot nobody checked.
    const mid = path.getPointAtLength(len / 2);
    const lx = s.lx ?? mid.x, ly = s.ly ?? mid.y + 12;

    const num = el("text", {
      class: "wire-num", x: lx, y: ly - 11, "text-anchor": "middle",
    });
    num.textContent = String(i + 1);
    const label = el("text", {
      class: "wire-label", x: lx, y: ly, "text-anchor": "middle",
    });
    label.textContent = s.label;

    const packet = el("circle", { class: "packet", r: 5, cx: 0, cy: 0 });
    packet.style.setProperty("--track", `path("${s.d}")`);

    wireLayer.append(num, label, packet);
    wires.push({ path, packet, label, num, len });
  });

  const flow = DATA.flows[flowIndex];

    const on = i === step;
    w.path.classList.toggle("on", on);
    w.path.classList.toggle("preview", !on);
    w.num.classList.toggle("on", on);
    w.label.classList.toggle("on", on);

    // and the class re-added. Without the reflow the browser coalesces both
    // mutations into no change at all and the step plays nothing.

    w.packet.classList.remove("run");

    w.path.style.setProperty("--dur", dur);
    w.packet.style.setProperty("--dur", dur);
    void w.path.getBoundingClientRect();
    w.path.classList.add("drawing");
    w.packet.classList.add("run");

    n.classList.toggle("from", id === s.from);
    n.classList.toggle("taking-part", inFlow.has(id) && id !== s.from && id !== s.to);

  pay.textContent = s.payload || "—";
  pay.style.display = s.payload ? "" : "none";
  const note = document.getElementById("note");
  note.textContent = s.note || "";
  note.style.display = s.note ? "" : "none";
  document.getElementById("counter").textContent = `step ${step + 1} / ${flow.steps.length}`;

  document.querySelectorAll("#step-list li").forEach((li, i) =>
    li.setAttribute("aria-current", String(i === step)));
  document.getElementById("back").disabled = step === 0;
  document.getElementById("next").disabled = step === flow.steps.length - 1;
}

function buildStepList() {
  const list = document.getElementById("step-list");
  list.innerHTML = "";
  DATA.flows[flowIndex].steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.textContent = `${i + 1}. ${s.label}`;
    li.onclick = () => { stop(); step = i; render(); };
    list.appendChild(li);
  });
}

function selectFlow(i) {
  stop();
  flowIndex = i; step = 0;
  document.querySelectorAll(".tab").forEach((t, j) =>
    t.setAttribute("aria-selected", String(j === i)));
  buildWires(document.getElementById("wires"));
  buildStepList();
  render();
}

function stop() {
  clearTimeout(timer); timer = null;
  document.getElementById("play").textContent = "▶ Play";
}

function play() {
  if (timer) return stop();
  document.getElementById("play").textContent = "❚❚ Pause";
  const tick = () => {
    const flow = DATA.flows[flowIndex];
    if (step >= flow.steps.length - 1) return stop();
    step++; render();
    timer = setTimeout(tick, duration(wires[step].len) + 700);
  };
  if (step >= DATA.flows[flowIndex].steps.length - 1) { step = 0; render(); }
  timer = setTimeout(tick, duration(wires[step].len) + 700);
}

document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
document.title = DATA.title;

const tabs = document.getElementById("tabs");
DATA.flows.forEach((f, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.textContent = f.name;
  b.onclick = () => selectFlow(i);
  tabs.appendChild(b);
});

document.getElementById("next").onclick = () => {
  stop();
  if (step < DATA.flows[flowIndex].steps.length - 1) { step++; render(); }
};
document.getElementById("back").onclick = () => {
  stop();
  if (step > 0) { step--; render(); }
};
document.getElementById("play").onclick = play;
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft") document.getElementById("back").click();
  if (e.key === " ") { e.preventDefault(); play(); }
});

buildStage();
selectFlow(0);
</script>
