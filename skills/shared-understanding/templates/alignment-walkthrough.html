<title>Alignment Walkthrough</title>

<!--
  Alignment walkthrough — one self-contained file, no build step, no dependencies.

  WHY THIS EXISTS
  Two people can read the same paragraph and picture different systems, and the
  disagreement only surfaces at review, after the work. A flow somebody can WATCH
  is falsifiable in a way a paragraph is not: the moment a packet takes an edge
  the reader did not expect, the mismatch is on screen.

  THE TECHNIQUE, AND WHY NOT THE OBVIOUS ONE
  Nodes are absolutely positioned in PERCENTAGES over a stage; the SVG that draws
  the wires is sized from the stage's real pixel box and redrawn on resize. A
  fixed viewBox with hard-coded coordinates was tried first and broke the moment
  the container was any other width — the labels overlapped and the wires pointed
  at where the nodes used to be.

  Wires anchor on the node EDGE via ray-rectangle intersection rather than on the
  centre, so an arrow stops at the box instead of disappearing under it. Packets
  ride `animateMotion` with `begin="indefinite"`, fired per step, so the motion
  matches the step being discussed instead of looping forever.

  TO FILL IN: only NODES and FLOWS below.
    NODES  id -> { label, kind, x, y }   x/y are percentages of the stage
    FLOWS  name -> [ { from, to, label, payload, note } ]

  `note` is where the thing a reader would get wrong goes. That sentence is the
  point of the whole file — the diagram shows what happens, the note says what
  people assume instead.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root {
    --bg: #f4f6f9; --panel: #fff; --ink: #16202b; --ink-soft: #5b6b7f;
    --rule: #dde4ed; --hair: #eef2f7;
    --actor: #4a72b0; --service: #3f8f74; --store: #9a6b3f; --external: #8a5a9e;
    --hot: #e0663f;
    --shadow: 0 1px 2px rgba(22,32,43,.05), 0 10px 30px rgba(22,32,43,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121820; --panel: #1a222c; --ink: #e8eef6; --ink-soft: #9aabbf;
      --rule: #2b3644; --hair: #222c38;
      --actor: #7aa3e0; --service: #63c3a2; --store: #cfa06a; --external: #bb8fd0;
      --hot: #ff8a5c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121820; --panel: #1a222c; --ink: #e8eef6; --ink-soft: #9aabbf;
    --rule: #2b3644; --hair: #222c38;
    --actor: #7aa3e0; --service: #63c3a2; --store: #cfa06a; --external: #bb8fd0;
    --hot: #ff8a5c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: clamp(1rem, 3vw, 2rem);
    background: var(--bg); color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.5;
  }
  header { max-width: 1180px; margin: 0 auto 1.1rem; }
  h1 { font-size: clamp(1.35rem, 3vw, 1.9rem); margin: 0 0 .2rem; text-wrap: balance; }
  .sub { color: var(--ink-soft); font-size: .92rem; margin: 0; }

  main { max-width: 1180px; margin: 0 auto; display: grid; gap: 1rem; }
  @media (min-width: 940px) { main { grid-template-columns: minmax(0,1fr) 19rem; } }

  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 14px; box-shadow: var(--shadow); padding: .85rem;
  }

  .tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .7rem; }
  .tab {
    font: 500 .84rem Inter, sans-serif; cursor: pointer;
    padding: .34rem .8rem; border-radius: 999px;
    border: 1px solid var(--rule); background: transparent; color: var(--ink-soft);
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .tab:focus-visible, .ctl:focus-visible { outline: 2px solid var(--actor); outline-offset: 2px; }

  .controls { display: flex; gap: .4rem; align-items: center; margin-bottom: .7rem; }
  .ctl {
    font: 500 .84rem Inter, sans-serif; cursor: pointer;
    padding: .34rem .7rem; border-radius: 8px;
    border: 1px solid var(--rule); background: transparent; color: var(--ink);
  }
  .counter { font: 500 .78rem "JetBrains Mono", monospace; color: var(--ink-soft); margin-left: auto; }

  /* The stage: nodes in %, SVG overlay measured from this box. */
  .stage { position: relative; width: 100%; height: 420px; }
  @media (max-width: 620px) { .stage { height: 520px; } }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    width: 132px; padding: .5rem .6rem;
    background: var(--panel); border: 1.5px solid var(--rule);
    border-radius: 10px; text-align: center;
    transition: opacity .3s cubic-bezier(.2,.8,.2,1), filter .3s,
                border-color .25s, box-shadow .25s;
  }
  .node .label { font: 500 .8rem Inter, sans-serif; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .node .kind { font: 400 .62rem "JetBrains Mono", monospace; color: var(--ink-soft); }
  .node[data-kind="actor"]    { border-color: var(--actor); }
  .node[data-kind="service"]  { border-color: var(--service); }
  .node[data-kind="store"]    { border-color: var(--store); }
  .node[data-kind="external"] { border-color: var(--external); }
  /* FOUR states, not two. A node that takes part in this FLOW but not in this
     STEP must not fade to the same grey as one the flow never touches — the eye
     needs to see the whole path and the current hop at the same time. Copied
     from the reference implementation, which distinguishes active / active-from
     / participant / dimmed. */
  .node.out       { opacity: .22; filter: saturate(.35); }
  .node.taking-part { opacity: .75; filter: saturate(.85); }
  .node.from {
    border-color: var(--hot);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--hot) 60%, transparent);
  }
  .node.to {
    border-color: var(--hot);
    box-shadow: 0 0 0 1px var(--hot),
                0 0 0 5px color-mix(in srgb, var(--hot) 14%, transparent);
  }

  /* Three wire states for the same reason: the rest of THIS flow stays visible
     as a dashed preview, so the reader sees where the packet came from and
     where it is going next. */
  .wire { fill: none; stroke: var(--hair); stroke-width: 1.5; opacity: .45; }
  .wire.preview { stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .45; }
  .wire.on { stroke: var(--hot); stroke-width: 2.5; opacity: 1; stroke-dasharray: 0; }
  .packet { fill: var(--hot); }
  /* The label sits ON the curve, so without a halo the wire draws straight
     through the digit and it stops being readable at exactly the moment it
     matters — when its own wire is the active one. `paint-order: stroke` puts
     the panel-coloured stroke UNDER the glyph instead of over it. */
  .wire-num, .wire-label {
    paint-order: stroke; stroke: var(--panel); stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .wire-num {
    font: 500 10px "JetBrains Mono", monospace; fill: var(--ink-soft);
  }
  .wire-num.on { fill: var(--hot); }
  /* What crosses the wire, written on the wire. In the sidebar it is a caption;
     here it is the edge's name, which is what a reader points at to disagree. */
  .wire-label {
    font: 500 10.5px Inter, sans-serif; fill: var(--hot);
    opacity: 0; transition: opacity .25s;
  }
  .wire-label.on { opacity: 1; }

  .side { display: flex; flex-direction: column; gap: .7rem; }
  .side h2 {
    font: 600 .72rem Inter, sans-serif; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-soft); margin: 0;
  }
  .step-title { font-weight: 600; font-size: .95rem; }
  .payload {
    font: 400 .78rem "JetBrains Mono", monospace; background: var(--bg);
    border: 1px solid var(--rule); border-radius: 8px; padding: .5rem .6rem;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  .note { font-size: .85rem; border-left: 3px solid var(--hot); padding-left: .65rem; color: var(--ink-soft); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .1rem; }
  .steps li {
    font-size: .82rem; padding: .28rem .45rem; border-radius: 6px;
    color: var(--ink-soft); cursor: pointer;
  }
  .steps li[aria-current="true"] { background: var(--bg); color: var(--ink); font-weight: 500; }
</style>

<header>
  <h1>Alignment Walkthrough</h1>
  <p class="sub">Watch the flow. Where a packet goes somewhere you did not expect, that is the gap.</p>
</header>

<main>
  <div class="card">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="controls">
      <button class="ctl" id="prev" type="button">‹ Back</button>
      <button class="ctl" id="play" type="button">▶ Play</button>
      <button class="ctl" id="next" type="button">Next ›</button>
      <span class="counter" id="counter">–</span>
    </div>
    <div class="stage" id="stage">
      <svg id="wires" aria-hidden="true"></svg>
    </div>
  </div>

  <aside class="card side">
    <h2>Current step</h2>
    <div class="step-title" id="step-title">–</div>
    <div class="payload" id="payload">–</div>
    <div class="note" id="note"></div>
    <h2>All steps</h2>
    <ol class="steps" id="step-list"></ol>
  </aside>
</main>

<script>
// ── EDIT ONLY THIS BLOCK ─────────────────────────────────────────────────────
const NODES = {
  ui:     { label: "Browser",     kind: "actor",    x: 11, y: 52 },
  api:    { label: "API gateway", kind: "service",  x: 36, y: 52 },
  worker: { label: "Worker",      kind: "service",  x: 64, y: 16 },
  db:     { label: "Postgres",    kind: "store",    x: 52, y: 88 },
  vendor: { label: "Payments",    kind: "external", x: 89, y: 16 },
};

const FLOWS = {
  "Happy path": [
    { from: "ui", to: "api", label: "POST /orders", payload: '{ "sku": "A-12", "qty": 2 }',
      note: "Readers assume this stays synchronous to the end. It does not — see step 3." },
    { from: "api", to: "db", label: "INSERT order", payload: "status = 'pending'",
      note: "The row exists before payment. A crash here leaves a pending order, which is why step 4 is idempotent." },
    { from: "api", to: "worker", label: "enqueue", payload: '{ "order_id": 8814 }',
      note: "Here the request stops being synchronous. The browser already has its 202." },
    { from: "worker", to: "vendor", label: "charge", payload: '{ "amount": 4200, "idem_key": "8814" }',
      note: "The idempotency key is the order id, so a retry cannot double-charge." },
    { from: "worker", to: "db", label: "UPDATE order", payload: "status = 'paid'",
      note: "Only now is the order real to the rest of the system." },
  ],
  "Vendor timeout": [
    { from: "worker", to: "vendor", label: "charge — attempt 1", payload: '{ "idem_key": "8814" }',
      note: "Times out at 3s. The vendor may or may not have taken the money — this is the case people forget." },
    { from: "worker", to: "vendor", label: "charge — attempt 2", payload: "same idem_key",
      note: "Same key, so the vendor replays the ORIGINAL result instead of charging again." },
    { from: "worker", to: "db", label: "UPDATE order", payload: "status = 'paid'",
      note: "Reached by both paths. Without idempotency the retry would be a second charge." },
  ],
};
// ── NOTHING BELOW NEEDS EDITING ──────────────────────────────────────────────

const stage = document.getElementById("stage");
const svg = document.getElementById("wires");
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let flowName = Object.keys(FLOWS)[0];
let step = 0;
let timer = null;
let wires = [];

function buildNodes() {
  stage.querySelectorAll(".node").forEach(n => n.remove());
  for (const [id, n] of Object.entries(NODES)) {
    const d = document.createElement("div");
    d.className = "node";
    d.id = "node-" + id;
    d.dataset.kind = n.kind;
    d.style.left = n.x + "%";
    d.style.top = n.y + "%";
    d.innerHTML = `<div class="label"></div><div class="kind"></div>`;
    d.querySelector(".label").textContent = n.label;
    d.querySelector(".kind").textContent = n.kind;
    stage.appendChild(d);
  }
}

/** Centre of a node, in stage-local pixels. */
function centre(id, sRect) {
  const r = document.getElementById("node-" + id).getBoundingClientRect();
  return {
    x: r.left - sRect.left + r.width / 2,
    y: r.top - sRect.top + r.height / 2,
    w: r.width, h: r.height,
  };
}

/** Where a line from `c` towards `t` leaves c's box — ray/rect intersection.
 *  Anchoring on the centre would bury the arrowhead under the node. */
function anchor(c, t) {
  const dx = t.x - c.x, dy = t.y - c.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 1) return { x: c.x + c.w / 2 + 6, y: c.y };
  const hw = c.w / 2 + 6, hh = c.h / 2 + 6;
  const k = Math.min(
    Math.abs(dx) > 0.001 ? hw / Math.abs(dx) : 1e6,
    Math.abs(dy) > 0.001 ? hh / Math.abs(dy) : 1e6
  );
  return { x: c.x + dx * k, y: c.y + dy * k };
}

function drawWires() {
  const sRect = stage.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${sRect.width} ${sRect.height}`);
  svg.textContent = "";
  wires = [];

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    `<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
             orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z"/></marker>`;
  // `context-stroke` makes each arrowhead inherit ITS OWN wire's stroke, so the
  // active step's head turns hot with the line instead of staying grey.
  defs.querySelector("#ah path").setAttribute("fill", "context-stroke");
  svg.appendChild(defs);

  FLOWS[flowName].forEach((s, i) => {
    const A = centre(s.from, sRect), B = centre(s.to, sRect);
    const a = anchor(A, B), b = anchor(B, A);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    // Perpendicular offset so parallel wires between the same pair stay apart.
    const nx = -dy / len, ny = dx / len;
    const bow = Math.max(10, Math.min(46, len * 0.13)) * (i % 2 ? -1 : 1);
    const cx = (a.x + b.x) / 2 + nx * bow, cy = (a.y + b.y) / 2 + ny * bow;
    const d = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;

    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", d);
    path.setAttribute("marker-end", "url(#ah)");
    svg.appendChild(path);

    const num = document.createElementNS(NS, "text");
    num.setAttribute("class", "wire-num");
    num.setAttribute("x", cx);
    num.setAttribute("y", cy - 5);
    num.setAttribute("text-anchor", "middle");
    num.textContent = String(i + 1);
    svg.appendChild(num);

    const lbl = document.createElementNS(NS, "text");
    lbl.setAttribute("class", "wire-label");
    lbl.setAttribute("x", cx);
    lbl.setAttribute("y", cy + 13);
    lbl.setAttribute("text-anchor", "middle");
    lbl.textContent = s.label;
    svg.appendChild(lbl);

    // cx/cy MUST be 0: `animateMotion` TRANSLATES from the element's current
    // position, so a circle placed at the wire's start ends up at start+path —
    // twice the offset, which parks the packet off in a corner. Measured in
    // Chrome before this line was fixed.
    const pkt = document.createElementNS(NS, "circle");
    pkt.setAttribute("class", "packet");
    pkt.setAttribute("r", 6);
    pkt.setAttribute("cx", 0);
    pkt.setAttribute("cy", 0);
    pkt.style.opacity = "0";
    svg.appendChild(pkt);

    const motion = document.createElementNS(NS, "animateMotion");
    motion.setAttribute("dur", "1.4s");
    motion.setAttribute("repeatCount", "1");
    motion.setAttribute("fill", "freeze");
    motion.setAttribute("begin", "indefinite");
    motion.setAttribute("path", d);
    pkt.appendChild(motion);

    wires[i] = { path, num, lbl, pkt, motion, end: b };
  });
}

function render() {
  const steps = FLOWS[flowName];
  const s = steps[step];

  wires.forEach((w, i) => {
    const on = i === step;
    w.path.classList.toggle("on", on);
    // Every other hop of THIS flow stays as a dashed preview: the reader keeps
    // the whole path in view while one hop is under discussion.
    w.path.classList.toggle("preview", !on);
    w.num.classList.toggle("on", on);
    w.lbl.classList.toggle("on", on);
    w.pkt.style.opacity = on ? "1" : "0";
    if (on) {
      if (reduceMotion) {
        w.pkt.setAttribute("transform", `translate(${w.end.x} ${w.end.y})`);
      } else {
        try { w.motion.beginElement(); } catch (e) { /* older engines: packet rests at origin */ }
      }
    }
  });

  // Which nodes this FLOW touches at all — the third state.
  const inFlow = new Set(steps.flatMap(st => [st.from, st.to]));
  for (const id of Object.keys(NODES)) {
    const n = document.getElementById("node-" + id);
    n.classList.toggle("from", id === s.from);
    n.classList.toggle("to", id === s.to);
    n.classList.toggle("taking-part", inFlow.has(id) && id !== s.from && id !== s.to);
    n.classList.toggle("out", !inFlow.has(id));
  }

  document.getElementById("step-title").textContent =
    `${NODES[s.from].label} → ${NODES[s.to].label}: ${s.label}`;
  document.getElementById("payload").textContent = s.payload || "—";
  document.getElementById("note").textContent = s.note || "";
  document.getElementById("counter").textContent = `step ${step + 1} / ${steps.length}`;

  const list = document.getElementById("step-list");
  list.textContent = "";
  steps.forEach((st, i) => {
    const li = document.createElement("li");
    li.textContent = `${i + 1}. ${st.label}`;
    if (i === step) li.setAttribute("aria-current", "true");
    li.onclick = () => { step = i; stop(); render(); };
    list.appendChild(li);
  });
}

function buildTabs() {
  const bar = document.getElementById("tabs");
  bar.textContent = "";
  for (const name of Object.keys(FLOWS)) {
    const b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(name === flowName));
    b.textContent = name;
    b.onclick = () => { flowName = name; step = 0; stop(); buildTabs(); drawWires(); render(); };
    bar.appendChild(b);
  }
}

function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById("play").textContent = "▶ Play";
}

document.getElementById("next").onclick = () => {
  step = (step + 1) % FLOWS[flowName].length; stop(); render();
};
document.getElementById("prev").onclick = () => {
  const n = FLOWS[flowName].length;
  step = (step - 1 + n) % n; stop(); render();
};
document.getElementById("play").onclick = (e) => {
  if (timer) return stop();
  e.target.textContent = "❚❚ Pause";
  timer = setInterval(() => {
    step = (step + 1) % FLOWS[flowName].length;
    render();
  }, 2200);
};

// Wires are measured from the DOM, so they must be recomputed when it moves.
let resizeJob;
addEventListener("resize", () => {
  clearTimeout(resizeJob);
  resizeJob = setTimeout(() => { drawWires(); render(); }, 120);
});

buildNodes();
buildTabs();
// Fonts change node widths, and the wires anchor on those widths.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { drawWires(); render(); });
}
requestAnimationFrame(() => { drawWires(); render(); });
</script>
