<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── tokens ──────────────────────────────────────────────────────────────────
   Light is the base. Dark redefines only the token values, twice: once behind
   prefers-color-scheme (guarded so an explicit light choice wins) and once
   behind the data-theme stamp. No component rule lives inside either block. */
:root {
  --ground:      #f6f7f6;
  --surface:     #ffffff;
  --surface-2:   #eef0ee;
  --line:        #d8dcd8;
  --line-soft:   #e6e9e6;
  --ink:         #1a1f1c;
  --ink-2:       #4a544d;
  --ink-3:       #78837a;

  /* Semantic, and separate from any accent. `killed` is deliberately NOT red:
     the contract calls it a successful outcome, and colouring it as an alarm
     would misreport eleven honest measurements as eleven failures. */
  --impeded:     #b3711f;
  --impeded-bg:  #fdf3e3;
  --shipped:     #2f6f6b;
  --shipped-bg:  #e6f0ef;
  --killed:      #6b7370;
  --killed-bg:   #edefee;
  --moving:      #2f5f8f;
  --moving-bg:   #e7eef6;

  --shadow: 0 1px 2px rgba(26,31,28,.06), 0 3px 8px rgba(26,31,28,.04);
  --radius: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:    #101512;
    --surface:   #171d19;
    --surface-2: #1f2622;
    --line:      #2b332e;
    --line-soft: #232b26;
    --ink:       #e6ebe7;
    --ink-2:     #a3aea7;
    --ink-3:     #78837c;
    --impeded:    #e0a253;
    --impeded-bg: #2a2116;
    --shipped:    #6fbdb5;
    --shipped-bg: #16211f;
    --killed:     #8b948f;
    --killed-bg:  #1c2320;
    --moving:     #7aa9d8;
    --moving-bg:  #17202a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --ground:    #101512;
  --surface:   #171d19;
  --surface-2: #1f2622;
  --line:      #2b332e;
  --line-soft: #232b26;
  --ink:       #e6ebe7;
  --ink-2:     #a3aea7;
  --ink-3:     #78837c;
  --impeded:    #e0a253;
  --impeded-bg: #2a2116;
  --shipped:    #6fbdb5;
  --shipped-bg: #16211f;
  --killed:     #8b948f;
  --killed-bg:  #1c2320;
  --moving:     #7aa9d8;
  --moving-bg:  #17202a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ── masthead ─────────────────────────────────────────────────────────────── */
header {
  flex: 0 0 auto;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 20px 0;
}
.top {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}
.path {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-3);
}
.live {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: .09em;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-3);
  transition: background .2s;
}
.dot.on { background: var(--shipped); }
.dot.pulse { animation: pulse .9s ease-out; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--shipped) 60%, transparent); }
  100% { box-shadow: 0 0 0 9px transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .dot.pulse { animation: none; }
}

/* Counters. Digits align, so tabular figures. */
.tallies { display: flex; gap: 22px; flex-wrap: wrap; padding-bottom: 12px; }
.tally { display: flex; flex-direction: column; gap: 1px; }
.tally b {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.1;
}
.tally span {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-3);
}
.tally.is-impeded b { color: var(--impeded); }
.tally.is-shipped b { color: var(--shipped); }
.tally.is-killed  b { color: var(--killed); }

.notice {
  margin: 0 0 12px;
  padding: 8px 11px;
  border-left: 2px solid var(--impeded);
  background: var(--impeded-bg);
  color: var(--ink-2);
  font-size: 12px;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.notice b { color: var(--ink); font-weight: 600; }


/* ── the supervisor ───────────────────────────────────────────────────────────
   A rail, not a column: the lead is context for the board, not a ninth phase. It
   exists because the board could show every item and not whether anything was
   moving — a session had handed its turn back and sat still for two hours, and the
   only way to find out was to attach to a tmux pane. */
.rail {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  gap: 0;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.rail.hidden { display: none; }
.pulse-cell {
  flex: 0 0 auto;
  padding: 9px 16px 9px 20px;
  border-right: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 190px;
}
.pulse-cell .label {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: .11em;
  color: var(--ink-3);
}
.pulse-cell .value {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 7px;
}
.beat { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.beat.working { background: var(--shipped); }
.beat.idle    { background: var(--impeded); }
.beat.stopped { background: var(--killed); }
.beat.unknown { background: var(--ink-3); }
.pulse-cell.is-idle .value    { color: var(--impeded); }
.pulse-cell.is-stopped .value { color: var(--killed); }

/* The decisions scroll sideways, newest first — "what just happened" is the only
   question anyone asks of a supervisor's log. */
.decisions {
  flex: 1 1 auto;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 9px 16px;
  align-items: center;
}
.decision {
  flex: 0 0 auto;
  max-width: 290px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 9px;
  background: var(--ground);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.decision.confirm  { border-left-color: var(--shipped);  background: var(--shipped-bg); }
.decision.escalate { border-left-color: var(--impeded);  background: var(--impeded-bg); }
.decision.stalled  { border-left-color: var(--impeded);  background: var(--impeded-bg); }
.decision.exhausted,
.decision.gone     { border-left-color: var(--killed);   background: var(--killed-bg); }
.decision .head {
  display: flex;
  gap: 7px;
  align-items: baseline;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
}
.decision .act { font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.decision.confirm  .act { color: var(--shipped); }
.decision.escalate .act,
.decision.stalled  .act { color: var(--impeded); }
.decision .when { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.decision .why {
  font-size: 11px;
  line-height: 1.3;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Age is information. Without it a decision from three hours ago sits beside one from
   a minute ago at the same weight, and the eye reads the row as all-current. */
.decision.aged { opacity: .55; }
.decision.aged .why { -webkit-line-clamp: 1; }
.decision.undated .when { font-style: italic; }

.decisions .none {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-3);
}

/* ── the board ────────────────────────────────────────────────────────────── */
/* ── the filter bar ───────────────────────────────────────────────────────
   The registry holds 170 items. Reading it is a matter of narrowing, and a board
   with no way to narrow answers only the question "what exists". */
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; }
.filters input[type="search"] {
  flex: 0 1 240px;
  font: inherit;
  font-size: 12.5px;
  padding: 5px 9px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.filters input[type="search"]:focus-visible,
.filters select:focus-visible { outline: 2px solid var(--moving); outline-offset: 1px; }
.filters select {
  font: inherit; font-size: 12px; padding: 5px 7px;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button {
  font: inherit; font-size: 11.5px; padding: 5px 11px;
  color: var(--ink-2); background: var(--surface);
  border: 0; border-left: 1px solid var(--line); cursor: pointer;
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--moving-bg); color: var(--moving); font-weight: 600; }
.filters .hits { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
.filters .hits b { color: var(--ink); font-weight: 600; }

/* ── the tabs ─────────────────────────────────────────────────────────────
   Three questions, three views: what is moving, how the one thing being built is
   going, and what has finished. They were three regions of one page competing for
   the same screen. */
.tabs {
  flex: 0 0 auto;
  display: flex;
  gap: 2px;
  padding: 0 14px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.tabs button {
  font: inherit;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  padding: 9px 15px 8px;
  color: var(--ink-3);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tabs button:hover { color: var(--ink-2); }
.tabs button[aria-selected="true"] {
  color: var(--ink);
  background: var(--ground);
  border-bottom-color: var(--moving);
}
.tabs button:focus-visible { outline: 2px solid var(--moving); outline-offset: -2px; }
.tabs .n {
  margin-left: 7px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}
.tabs button[aria-selected="true"] .n { color: var(--moving); }

/* ── the two zones ────────────────────────────────────────────────────────
   Work still in the cycle and work that has left it are different questions, and
   putting them in one row of columns let 144 finished items crowd out the 26 that
   were moving. They are separated, both are counted, and neither is hidden. */
.board {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-top: 1px solid var(--line);
}
.zone { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.zone-head {
  flex: 0 0 auto;
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.zone-head h2 {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .11em; color: var(--ink-2);
}
.zone-head .sub { font-size: 11.5px; color: var(--ink-3); }
.zone-head .sub b { color: var(--ink-2); font-weight: 600; }
.zone-head button {
  margin-left: auto;
  font: inherit; font-size: 11.5px; padding: 3px 10px;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer;
}
.zone-head button:hover { color: var(--ink); border-color: var(--ink-3); }
.lanes {
  flex: 1 1 auto;
  display: flex;
  gap: 1px;
  overflow-x: auto;
  overflow-y: hidden;
  background: var(--line-soft);
  min-height: 0;
}
.col {
  flex: 1 1 258px;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  min-height: 0;
}
.col-head {
  flex: 0 0 auto;
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface-2);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.col-head .name {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* The ordinal is information here: these are the cycle's phases, and the order
   is the order work moves through them. */
.col-head .ord {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.col-head .n.live { color: var(--moving); font-weight: 600; }
.col-head .n {
  margin-left: auto;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--ink-3);
}
.col.terminal .col-head { background: var(--killed-bg); }
/* An empty column is part of the cycle and stays on the board — but it is not
   competing for the eye with a column that holds work. */
/* Two columns sharing the strip: the phase-width cap exists so a lane stays
   readable next to seven others, and there are only two here. Their cards go in a
   grid rather than a single file — 144 finished items read as a list nobody
   scrolls, and as a grid they are scannable at a glance. */
.zone.settled .col { max-width: none; }
.zone.settled .stack {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
  align-content: start;
}
.col.vacant { flex: 1 1 138px; min-width: 138px; max-width: 230px; background: var(--ground); }
.col.vacant .col-head { opacity: .45; }
.col.vacant .col-head .n { display: none; }
.col.vacant .stack { display: none; }

.stack {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.empty {
  color: var(--ink-3);
  font-size: 11.5px;
  font-style: italic;
  padding: 5px 3px;
}

/* ── the implementation view ──────────────────────────────────────────────
   One block per item that has a plan on disk: its own header, and the plan's phases
   as lanes with the tasks inside them. Every number here is read from the plan and
   the progress file — an item with neither gets no block, rather than an empty
   drawing of a process. */
.impl { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex;
        flex-direction: column; gap: 16px; }
.impl-item {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.impl-head { padding: 11px 14px 10px; border-bottom: 1px solid var(--line-soft);
             background: var(--surface-2); }
.impl-head .line1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.impl-head .iid { font-family: "IBM Plex Mono", ui-monospace, monospace;
                  font-size: 12.5px; font-weight: 600; color: var(--ink); }
.impl-head .ttl { font-size: 13px; color: var(--ink); }
.impl-head .who { margin-left: auto; font-size: 11px; color: var(--ink-3);
                  font-family: "IBM Plex Mono", ui-monospace, monospace; }
.impl-head .slug { font-family: "IBM Plex Mono", ui-monospace, monospace;
                   font-size: 10.5px; color: var(--ink-3); margin-top: 3px;
                   display: block; }
.bar { margin-top: 8px; display: flex; align-items: center; gap: 9px; }
.bar .track { flex: 1 1 auto; height: 5px; border-radius: 3px;
              background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; background: var(--shipped); }
.bar .pct { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
            color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar .of { font-size: 11px; color: var(--ink-3); }
.impl-marks { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.plan-lanes { display: flex; gap: 1px; background: var(--line-soft); overflow-x: auto; }
.plan-lane { flex: 1 1 250px; min-width: 220px; background: var(--ground);
             display: flex; flex-direction: column; }
.plan-lane .lane-head { padding: 8px 11px 7px; border-bottom: 1px solid var(--line-soft); }
.plan-lane .lane-head .k { font-family: "IBM Plex Mono", ui-monospace, monospace;
                           font-size: 10px; color: var(--ink-3); letter-spacing: .08em; }
.plan-lane .lane-head .t { display: block; font-size: 12px; color: var(--ink-2);
                           margin-top: 2px; }
.plan-lane .lane-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.task {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 9px;
}
.task.done    { border-left-color: var(--shipped); }
.task.running { border-left-color: var(--moving); }
.task.blocked { border-left-color: var(--impeded); background: var(--impeded-bg); }
.task .tid { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
             font-weight: 600; color: var(--ink); }
.task .tst { float: right; font-family: "IBM Plex Mono", ui-monospace, monospace;
             font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--ink-3); }
.task.done .tst    { color: var(--shipped); }
.task.blocked .tst { color: var(--impeded); }
.task .files { margin-top: 4px; display: flex; flex-direction: column; gap: 1px; }
.task .files code { font-family: "IBM Plex Mono", ui-monospace, monospace;
                    font-size: 10.5px; color: var(--ink-2); word-break: break-all; }
.task .foot { margin-top: 5px; display: flex; gap: 9px; font-size: 10px;
              color: var(--ink-3); font-family: "IBM Plex Mono", ui-monospace, monospace; }
.impl .loading, .impl .none { color: var(--ink-3); font-size: 12.5px; font-style: italic; }

/* ── cards ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 9px 10px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.card.impeded  { border-left-color: var(--impeded); background: var(--impeded-bg); }
.card.shipped  { border-left-color: var(--shipped); }
.card.killed   { border-left-color: var(--killed); opacity: .72; }
.card.measured { border-left-color: var(--moving); }

/* Work happening NOW. The board could only draw what had finished, so an item under
   active work showed the verdict of a phase that was already over and nothing said
   anything was running. This is the one state that earns motion. */
.card.running {
  border-left-color: var(--moving);
  border-left-width: 3px;
  background: var(--moving-bg);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--moving) 30%, transparent), var(--shadow);
}
.card.running .id::after {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  margin-left: 7px;
  border-radius: 50%;
  background: var(--moving);
  animation: breathe 1.8s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) {
  .card.running .id::after { animation: none; }
}
.chip.running {
  background: var(--moving);
  color: var(--surface);
  border: 1px solid var(--moving);
}
:root[data-theme="dark"] .chip.running,
:root:not([data-theme="light"]) .chip.running { color: var(--ground); }

.card .dom {
  float: right;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}
.card .id {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--ink-2);
}
.card .title {
  font-size: 12.5px;
  line-height: 1.35;
  text-wrap: pretty;
}
.card .meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.chip {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: .07em;
  padding: 2px 5px;
  border-radius: 2px;
  background: var(--surface-2);
  color: var(--ink-3);
  white-space: nowrap;
}
.chip.status { color: var(--ink-2); }
.chip.wall { background: transparent; color: var(--impeded); border: 1px solid var(--impeded); }
/* A verdict is coloured by what it SAYS. `FAIL` drawn in the shipped green read as
   a pass at a glance, which is the one reading a board must never allow. */
.chip.verdict { background: var(--surface-2); color: var(--ink-2); }
.chip.verdict.good { background: var(--shipped-bg); color: var(--shipped); }
.chip.verdict.bad  { background: var(--impeded-bg); color: var(--impeded); }
/* An inferred position and a measured one must not read alike. */
.chip.derived { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); }
/* Ended, not running: the phase finished and nothing has been observed since. Quiet,
   because it is the ordinary state of a stream that only records completions. */
.chip.ended { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* Impediment notes are prose written by whoever hit the wall, and they run long —
   the one in the measured registry is a full paragraph. Clamped to three lines so a
   single blocked card cannot own the column; the full text is one click away, because
   truncating it permanently would hide the only thing that says what to do next. */
.wall-note {
  font-size: 11px;
  color: var(--impeded);
  line-height: 1.35;
  border-top: 1px dashed color-mix(in srgb, var(--impeded) 40%, transparent);
  padding-top: 5px;
}
/* The text lives IN the summary, not after it: a <details> hides everything but the
   summary when closed, so a preview placed in the body vanishes entirely instead of
   clamping. Opening un-clamps the same element, which keeps one copy of the text. */
.wall-note summary {
  cursor: pointer;
  list-style: none;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.wall-note summary::-webkit-details-marker { display: none; }
.wall-note[open] summary { -webkit-line-clamp: unset; overflow: visible; }
.wall-note summary:focus-visible { outline: 2px solid var(--impeded); outline-offset: 2px; }
/* The affordance renders after the summary, so it is a ::after on the <details>
   itself — inside the clamped box it would be clipped along with the text. */
.wall-note::after {
  display: block;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  opacity: .7;
  margin-top: 4px;
  cursor: pointer;
}
.wall-note:not([open])::after { content: "full text ▾"; }
.wall-note[open]::after { content: "less ▴"; }
.wall-note:hover::after { opacity: 1; }


/* ── the item panel ───────────────────────────────────────────────────────────
   The board answers "where is each item". This answers "what is being done inside
   it", which is where the work actually happens — a plan's phases, its tasks, the
   artefacts each cycle phase left, and every verdict rather than only the last. */
.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(820px, 96vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: -8px 0 24px rgba(0,0,0,.10);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .18s ease-out;
  z-index: 20;
}
.panel.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

.panel-head {
  flex: 0 0 auto;
  padding: 13px 16px 11px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.panel-head .pid {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 13px; font-weight: 600;
}
.panel-head .pslug {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.panel-head button {
  margin-left: auto;
  font: inherit; font-size: 15px; line-height: 1;
  background: transparent; border: 0; color: var(--ink-3);
  cursor: pointer; padding: 2px 4px;
}
.panel-head button:hover { color: var(--ink); }
.panel-head button:focus-visible { outline: 2px solid var(--moving); outline-offset: 2px; }

.panel-body { flex: 1 1 auto; overflow-y: auto; padding: 13px 16px 24px; }

/* Progress, counted from task status — the only place that knows. The number is
   stated beside the bar because a bar alone invites estimating. */
.pprogress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.pbar {
  flex: 1 1 auto; height: 5px; border-radius: 3px;
  background: var(--surface-2); overflow: hidden;
}
.pbar > i { display: block; height: 100%; background: var(--shipped); border-radius: 3px; }
.pprogress .pct {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--shipped);
}
.pprogress .frac {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; color: var(--ink-3);
}
.powner {
  display: flex; gap: 7px; align-items: baseline;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px; color: var(--ink-2);
  margin-bottom: 14px;
}
.powner .olabel {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
}
.powner .onote { color: var(--ink-3); font-size: 10px; }
.psec { margin-bottom: 20px; }
.psec > h3 {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .11em;
  color: var(--ink-3); margin: 0 0 8px;
  display: flex; gap: 7px; align-items: baseline;
}
.psec > h3 .count { font-variant-numeric: tabular-nums; }
.pempty { font-size: 11.5px; color: var(--ink-3); font-style: italic; }

/* The plan as a board of its own: one column per plan phase, one card per task. The
   phases of a plan are a sequence the same way the cycle's are, so the same shape
   carries over — and a task's column says where it sits in that sequence, which a
   stacked list could only say by ordering. */
.pboard {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 6px;
  align-items: flex-start;
}
.pphase {
  flex: 0 0 232px;
  background: var(--ground);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 8px;
  min-height: 70px;
}
.pphase-head {
  display: flex; gap: 7px; align-items: baseline;
  padding-bottom: 5px; margin-bottom: 7px;
  border-bottom: 1px solid var(--line-soft);
}
.pphase-head .num {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.pphase-head .name { font-size: 12px; font-weight: 600; text-wrap: balance; }
.ptask {
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px 8px;
  font-size: 11.5px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 2px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 5px;
}
.ptask .trow { display: flex; gap: 7px; align-items: baseline; }
.ptask.done      { border-left-color: var(--shipped); }
.ptask.running   { border-left-color: var(--moving); }
.ptask.blocked   { border-left-color: var(--impeded); }
.ptask .tid {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px; font-weight: 600; color: var(--ink-2);
  flex: 0 0 auto;
}
.ptask .tfiles {
  color: var(--ink-3);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ptask .tcommit {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px; color: var(--ink-3);
}
.ptask .tstat {
  margin-left: auto; flex: 0 0 auto;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-3);
}
.ptask.done .tstat    { color: var(--shipped); }
.ptask.running .tstat { color: var(--moving); }
.ptask.blocked .tstat { color: var(--impeded); }

/* Artefacts: paths, not links — the board is read-only and cannot serve the file. */
.part {
  display: flex; gap: 8px; align-items: baseline;
  padding: 3px 0;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
}
.part .pph {
  flex: 0 0 88px;
  color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .06em; font-size: 9.5px;
}
.part .ppath { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Verdict history — every one, because a single last verdict hides ten iterations. */
.pverdict {
  display: flex; gap: 8px; align-items: baseline;
  padding: 3px 0;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
}
.pverdict .pph { flex: 0 0 88px; color: var(--ink-3); font-size: 9.5px; text-transform: uppercase; }
.pverdict .pv { color: var(--ink-2); }
.pverdict.bad .pv { color: var(--impeded); }
.pverdict.good .pv { color: var(--shipped); }
.pverdict .pwhen { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.pblock {
  border-left: 2px solid var(--impeded);
  background: var(--impeded-bg);
  padding: 6px 9px;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 11.5px;
  color: var(--ink-2);
  margin-bottom: 5px;
}
.pblock b { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--impeded); }

.card { cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--moving); outline-offset: 1px; }

/* ── footer ───────────────────────────────────────────────────────────────── */
footer {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 7px 20px;
  display: flex;
  gap: 16px;
  align-items: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  color: var(--ink-3);
  flex-wrap: wrap;
}
.key { display: flex; align-items: center; gap: 5px; }
.swatch { width: 9px; height: 9px; border-radius: 1px; border: 1px solid var(--line); }
.swatch.impeded { background: var(--impeded); border-color: var(--impeded); }
.swatch.measured { background: var(--moving); border-color: var(--moving); }
.swatch.shipped { background: var(--shipped); border-color: var(--shipped); }
.swatch.killed { background: var(--killed); border-color: var(--killed); }
footer .right { margin-left: auto; }

button.theme {
  font: inherit;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-2);
  border-radius: 2px;
  padding: 2px 7px;
  cursor: pointer;
}
button.theme:hover { border-color: var(--ink-3); }
button.theme:focus-visible { outline: 2px solid var(--moving); outline-offset: 1px; }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Cycle Board</h1>
    <span class="path mono" id="path">—</span>
    <span class="live"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
  </div>
  <div class="tallies" id="tallies"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="filter by id or title" aria-label="Filter items">
    <div class="seg" role="group" aria-label="Scope">
      <button type="button" data-scope="all" aria-pressed="true">all</button>
      <button type="button" data-scope="impeded" aria-pressed="false">impeded</button>
      <button type="button" data-scope="observed" aria-pressed="false">observed</button>
    </div>
    <select id="dom" aria-label="Domain"><option value="">every domain</option></select>
    <span class="hits" id="hits"></span>
  </div>
  <div id="notice"></div>
</header>

<section class="rail hidden" id="rail"></section>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="board" id="board"></main>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <span class="pid mono" id="p-id">—</span>
    <span class="pslug" id="p-slug"></span>
    <button type="button" id="p-close" aria-label="Close">✕</button>
  </div>
  <div class="panel-body" id="p-body"></div>
</aside>

<footer>
  <span class="key"><span class="swatch measured"></span>running now</span>
  <span class="key">ended here — the phase finished; nothing observed since</span>
  <span class="key"><span class="swatch impeded"></span>impeded</span>
  <span class="key"><span class="swatch shipped"></span>done — shipped</span>
  <span class="key"><span class="swatch killed"></span>killed — a successful outcome</span>
  <span class="right" id="stamp">—</span>
  <button class="theme" id="theme" type="button">theme</button>
</footer>

<script>
"use strict";

const PHASE_LABEL = {
  "backlog": "Backlog", "discover": "Discover", "plan": "Plan",
  "implement": "Implement", "code-quality": "Code quality", "review": "Review",
  "release": "Release", "acceptance": "Acceptance", "done": "Done", "killed": "Killed"
};

const el = (id) => document.getElementById(id);

// A verdict's tone. Read by both the board and the item panel, so it is declared
// once, above the first reader. Anything in neither set is drawn neutral — an
// unrecognised verdict is not evidence of success, and must never be coloured as one.
const BAD_VERDICTS = new Set([
  "INVALID", "FAIL", "FAIL_HARD", "FAIL_SOFT", "BLOCKED", "NEEDS_FIXES", "NEEDS_DEEPER",
  "NEEDS_REVISION", "AWAITING_REVIEW", "NEEDS_SPLIT", "REJECTED", "NOT_VALIDATED",
]);
const GOOD_VERDICTS = new Set([
  "PASS", "SHIPPABLE", "RELEASED", "READY_TO_MERGE", "ACCEPTED", "VALIDATED",
  "ITEM_REGISTERED", "PLAN_WRITTEN", "OPPORTUNITY_COMPLETE",
]);

function cardClass(item) {
  // Running outranks everything: what is happening to an item now matters more than
  // where it got to, and an impeded item cannot be running anyway.
  if (item.running_phase) return "running";
  if (item.blocked) return "impeded";
  if (item.status === "shipped") return "shipped";
  if (item.status === "killed") return "killed";
  if (item.position_from === "stream") return "measured";
  return "";
}


// ── the supervisor rail ──────────────────────────────────────────────────────
// Rendered from the lead's own log and the executing session's activity marker.
// Absent supervisor means an absent rail, not an empty one: a board with no lead is
// the normal case, and a permanently blank strip reads as something broken.

const ACTION_LABEL = {
  confirm: "confirmed", escalate: "escalated", stalled: "stalled",
  exhausted: "gave up", gone: "session gone",
};

function sessionPulse(lead) {
  if (!lead.watching || lead.idle_seconds === null) {
    return { cls: "unknown", text: "not measured", note: "no activity marker" };
  }
  const s = lead.idle_seconds;
  const human = s < 90 ? `${s}s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
  // The thresholds mirror the lead's own: it may act after 120s and calls a turn
  // handed back at 900s. Showing different ones would describe a different watchdog.
  if (s < 120) return { cls: "working", text: "working", note: `last moved ${human} ago` };
  if (s < 900) return { cls: "idle", text: `idle ${human}`, note: "within the lead's window" };
  return { cls: "stopped", text: `stopped ${human}`, note: "turn handed back — needs a person" };
}

function clock(iso) {
  if (!iso) return "no time";
  const d = new Date(iso);
  if (isNaN(d)) return "no time";
  const mins = Math.round((Date.now() - d) / 60000);
  // Relative, not absolute: "12:48" makes the reader do the subtraction, and the only
  // thing they want from a supervisor's log is how long ago.
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = mins / 60;
  return hrs < 24 ? `${hrs.toFixed(hrs < 10 ? 1 : 0)}h ago` : `${Math.round(hrs / 24)}d ago`;
}

//: A decision older than this is context, not news. Half the lead's stall horizon.
const FRESH_MS = 450 * 1000;

function isAged(iso) {
  if (!iso) return true;               // undated entries predate the timestamp fix
  const d = new Date(iso);
  return isNaN(d) || (Date.now() - d) > FRESH_MS;
}

function renderRail(lead) {
  const rail = el("rail");
  if (!lead || (!lead.watching && !(lead.decisions || []).length)) {
    rail.classList.add("hidden");
    return;
  }
  rail.classList.remove("hidden");

  const pulse = sessionPulse(lead);
  const decisions = lead.decisions || [];
  const cells = `
    <div class="pulse-cell is-${pulse.cls === "working" ? "working" : pulse.cls}">
      <span class="label">executing session</span>
      <span class="value"><span class="beat ${pulse.cls}"></span>${pulse.text}</span>
      <span class="label" style="text-transform:none;letter-spacing:0">${pulse.note}</span>
    </div>
    <div class="pulse-cell">
      <span class="label">lead decisions</span>
      <span class="value">${decisions.length}</span>
      <span class="label" style="text-transform:none;letter-spacing:0">${
        decisions.length ? "newest first" : "nothing to answer yet"}</span>
    </div>`;

  const cards = decisions.length ? decisions.map(d => `
      <article class="decision ${d.event}${isAged(d.at) ? " aged" : ""}${d.at ? "" : " undated"}">
        <div class="head">
          <span class="act">${ACTION_LABEL[d.event] || d.event}</span>
          <span>${d.item || ""}</span>
          <span class="when">${clock(d.at)}</span>
        </div>
        <div class="why">${escapeHtml(d.reason || "")}</div>
      </article>`).join("")
    : `<span class="none">the lead is watching; it has had nothing to answer</span>`;

  rail.innerHTML = cells + `<div class="decisions">${cards}</div>`;
}

// ── the board ────────────────────────────────────────────────────────────────
// Two zones. Work still inside the cycle gets the room; work that has left it is
// counted, reachable and out of the way. Everything the registry holds is on this
// page — the filter narrows what is drawn and always says by how much.

let LAST_STATE = null;
let SCOPE = "all";
let QUERY = "";
let DOMAIN = "";
let TAB = "cycle";

const SETTLED = ["done", "killed"];

//: An item that has left the cycle, unless something is running on it again.
function hasSettled(it) {
  return SETTLED.includes(it.phase) && !it.running_phase;
}

function matches(it) {
  if (DOMAIN && it.domain !== DOMAIN) return false;
  if (SCOPE === "impeded" && !it.blocked && !(it.blockers || []).length) return false;
  if (SCOPE === "observed" && it.position_from === "derived") return false;
  if (QUERY) {
    const hay = (it.id + " " + (it.title || "") + " " + (it.domain || "")).toLowerCase();
    if (!hay.includes(QUERY)) return false;
  }
  return true;
}

function cardHtml(it) {
  // A chip earns its place by telling this card apart from its neighbours. The old
  // board printed `status` on every card — which just repeats the column it is in —
  // and `derived` on 165 of 170, so the two loudest marks carried no information.
  // What is left is what actually varies.
  const chips = [];
  if (it.running_phase) {
    chips.push(`<span class="chip running">running</span>`);
  } else if (it.position_from === "stream" && !it.last_verdict) {
    // Only where there is no verdict to say it. A verdict IS the phase ending, and
    // printing both put "ended here / ITEM_REGISTERED" on every card in the column.
    chips.push(`<span class="chip ended" title="this phase ended; nothing observed since">ended here</span>`);
  }
  if (it.last_verdict) {
    const v = String(it.last_verdict).toUpperCase();
    const tone = GOOD_VERDICTS.has(v) ? "good" : BAD_VERDICTS.has(v) ? "bad" : "";
    chips.push(`<span class="chip verdict ${tone}" title="this phase ended with ${escapeHtml(v)}">${escapeHtml(it.last_verdict)}</span>`);
  }
  if (it.blockers && it.blockers.length) {
    chips.push(`<span class="chip wall">waits on ${it.blockers.join(", ")}</span>`);
  } else if (it.blocked) {
    chips.push(`<span class="chip wall">impeded</span>`);
  }
  // The registry's own word, but only where it can disagree with the column: a
  // measured position comes from the stream and the status comes from BACKLOG.md,
  // and the two parting ways is the one case worth reading.
  if (it.position_from !== "derived" && it.status) {
    chips.push(`<span class="chip status">${escapeHtml(it.status)}</span>`);
  }
  const note = it.blocked && it.blocked_note
    ? `<details class="wall-note"><summary>${escapeHtml(it.blocked_note)}</summary></details>` : "";
  const dom = it.domain ? `<span class="dom">${escapeHtml(it.domain)}</span>` : "";
  const meta = chips.length ? `<div class="meta">${chips.join("")}</div>` : "";
  return `<article class="card ${cardClass(it)}" data-item="${it.id}" tabindex="0">
      ${dom}<div class="id mono">${it.id}</div>
      <div class="title">${escapeHtml(it.title || "")}</div>
      ${meta}${note}
    </article>`;
}

function columnHtml(phase, items, ordinal) {
  const here = items.filter(it => (it.running_phase || it.phase) === phase);
  const liveHere = here.filter(it => it.running_phase).length;
  const terminal = SETTLED.includes(phase);
  const ord = ordinal ? `<span class="ord">${String(ordinal).padStart(2, "0")}</span>` : "";
  // No "nothing here" placeholder: the column head already carries the count, and
  // five identical notes across the empty phases read as five findings.
  const body = here.map(cardHtml).join("");
  return `<section class="col ${terminal ? "terminal" : ""} ${here.length ? "" : "vacant"}">
      <div class="col-head">${ord}<span class="name">${PHASE_LABEL[phase] || phase}</span>
        <span class="n${liveHere ? " live" : ""}">${here.length}</span></div>
      <div class="stack">${body}</div>
    </section>`;
}

function render(state) {
  LAST_STATE = state;
  el("path").textContent = state.project_path || "";

  const all = state.items || [];
  const blocked = all.filter(i => i.blocked).length;
  const shipped = all.filter(i => i.status === "shipped").length;
  const killed = all.filter(i => i.status === "killed").length;
  const inCycle = all.filter(i => !SETTLED.includes(i.phase) || i.running_phase).length;

  el("tallies").innerHTML = [
    ["", all.length, "in the registry"],
    ["", inCycle, "in the cycle"],
    ["is-impeded", blocked, "impeded"],
    ["is-shipped", shipped, "done"],
    ["is-killed", killed, "killed"],
    ["", (state.running || []).length, "running now"]
  ].map(([cls, n, label]) =>
    `<div class="tally ${cls}"><b>${n}</b><span>${label}</span></div>`
  ).join("");

  // The domain list comes from the data, so a registry that grows a domain gains the
  // option without anyone editing this page.
  const domains = [...new Set(all.map(i => i.domain).filter(Boolean))].sort();
  const sel = el("dom");
  const wanted = `<option value="">every domain</option>` +
    domains.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
  if (sel.innerHTML !== wanted) { sel.innerHTML = wanted; sel.value = DOMAIN; }

  el("notice").innerHTML = state.has_stream ? "" :
    `<p class="notice"><b>No event stream yet.</b> Every position below is derived from
     each item's <code class="mono">status</code>, not from a phase that was observed
     to run. Positions become measured once the phases emit — the board updates by
     itself when the first event lands.</p>`;

  const shown = all.filter(matches);
  // Narrowing is stated. A board that quietly drops 140 items reads as a board with
  // 30 items on it, and the reader has no way to tell the difference.
  el("hits").innerHTML = shown.length === all.length
    ? `showing all <b>${all.length}</b>`
    : `showing <b>${shown.length}</b> of ${all.length} · <a href="#" id="clearf">clear</a>`;
  const clear = el("clearf");
  if (clear) clear.addEventListener("click", e => {
    e.preventDefault();
    QUERY = ""; DOMAIN = ""; SCOPE = "all";
    el("q").value = ""; el("dom").value = "";
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.scope === "all")));
    render(LAST_STATE);
  });

  const phases = state.phases || [];
  const inCycleShown = shown.filter(it => !hasSettled(it));
  const settledShown = shown.filter(hasSettled);
  const plannedShown = shown.filter(it => it.plan_slug);

  const TABS = [
    ["cycle", "In the cycle", inCycleShown.length],
    ["implement", "In implement", plannedShown.length],
    ["settled", "Left the cycle", settledShown.length],
  ];
  el("tabs").innerHTML = TABS.map(([key, label, n]) =>
    `<button type="button" role="tab" data-tab="${key}" aria-selected="${TAB === key}">
       ${label}<span class="n">${n}</span></button>`).join("");
  document.querySelectorAll("#tabs button").forEach(btn => {
    btn.addEventListener("click", () => { TAB = btn.dataset.tab; render(LAST_STATE); });
  });

  if (TAB === "cycle") {
    el("board").innerHTML = `<section class="zone">
        <div class="lanes">${phases.map((ph, i) => columnHtml(ph, inCycleShown, i + 1)).join("")}</div>
      </section>`;
  } else if (TAB === "settled") {
    el("board").innerHTML = `<section class="zone settled">
        <div class="lanes">${SETTLED.map(ph => columnHtml(ph, settledShown, 0)).join("")}</div>
      </section>`;
  } else {
    renderImplementation(plannedShown);
  }

  renderRail(state.lead);
  el("stamp").textContent = "updated " + new Date().toLocaleTimeString();
}

// ── the implementation view ──────────────────────────────────────────────────
// Every step of every planned item: the plan's own phases as lanes, and the tasks
// the progress file records inside them. Details are fetched per item and cached
// against what the board already knows changed — the stream fires often, and
// re-reading every plan on every event would spend the page on nothing.

const DETAIL = new Map();

//: What makes a cached detail stale. If neither the last event nor the running phase
//: has moved, nothing on disk that this view draws can have moved either.
function detailKey(it) {
  return [it.id, it.last_at || "", it.running_since || "", it.plan_slug || ""].join("|");
}

function fetchDetail(it) {
  const key = detailKey(it);
  const held = DETAIL.get(it.id);
  if (held && held.key === key) return;
  DETAIL.set(it.id, { key, loading: true, detail: held && held.detail });
  fetch("/api/item/" + encodeURIComponent(it.id))
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(detail => {
      DETAIL.set(it.id, { key, loading: false, detail });
      if (TAB === "implement" && LAST_STATE) render(LAST_STATE);
    })
    .catch(err => {
      // Stated, not swallowed. A silently empty block reads as "this item has no
      // steps", which is a different fact from "the board could not read them".
      DETAIL.set(it.id, { key, loading: false, error: String(err.message || err) });
      if (TAB === "implement" && LAST_STATE) render(LAST_STATE);
    });
}

function taskHtml(task) {
  const files = (task.files || []).length
    ? `<div class="files">${task.files.map(f => `<code>${escapeHtml(f)}</code>`).join("")}</div>`
    : "";
  const foot = [];
  if (task.commit) foot.push(`<span title="commit">${escapeHtml(String(task.commit).slice(0, 8))}</span>`);
  if (task.iterations) foot.push(`<span>${task.iterations} iteration(s)</span>`);
  return `<div class="task ${taskClass(task.status)}">
      <span class="tst">${escapeHtml(task.status || "unknown")}</span>
      <span class="tid">${escapeHtml(task.id || "—")}</span>
      ${files}${foot.length ? `<div class="foot">${foot.join("")}</div>` : ""}
    </div>`;
}

function planLanes(detail) {
  const tasks = detail.tasks || [];
  const lanes = (detail.phases || []).map(ph => ({
    key: "Phase " + ph.key, title: ph.title,
    tasks: tasks.filter(t => String(t.phase) === String(ph.key)),
  }));
  // A task whose phase the plan does not name still gets drawn. Dropping it would
  // hide work because a heading was worded differently.
  const named = new Set((detail.phases || []).map(ph => String(ph.key)));
  const orphans = tasks.filter(t => !named.has(String(t.phase)));
  if (orphans.length) {
    lanes.push({ key: "Unlisted", title: "tasks whose phase the plan does not name",
                 tasks: orphans });
  }
  if (!lanes.length) return null;
  return `<div class="plan-lanes">${lanes.map(l => `
    <section class="plan-lane">
      <div class="lane-head"><span class="k">${escapeHtml(l.key)}</span>
        <span class="t">${escapeHtml(l.title || "")}</span></div>
      <div class="lane-body">${l.tasks.length
        ? l.tasks.map(taskHtml).join("")
        : `<div class="empty">no task recorded</div>`}</div>
    </section>`).join("")}</div>`;
}

function implBlock(it) {
  const held = DETAIL.get(it.id);
  const detail = held && held.detail;
  const where = it.running_phase
    ? `running ${PHASE_LABEL[it.running_phase] || it.running_phase}`
    : `${PHASE_LABEL[it.phase] || it.phase}`;

  let body;
  if (held && held.error) {
    body = `<div class="impl"><span class="none">could not read this item: ${escapeHtml(held.error)}</span></div>`;
  } else if (!detail) {
    body = `<div class="lane-body"><span class="loading">reading the plan…</span></div>`;
  } else {
    body = planLanes(detail)
      || `<div class="lane-body"><span class="none">a plan exists on disk but names no phases yet</span></div>`;
  }

  // The ratio is counted from task status, so it is only shown once the tasks are in.
  const ratio = detail && typeof detail.done_ratio === "number" ? detail.done_ratio : null;
  const doneN = detail ? (detail.tasks || []).filter(t => taskClass(t.status) === "done").length : 0;
  const totalN = detail ? (detail.tasks || []).length : 0;
  const bar = ratio === null ? "" : `<div class="bar">
      <div class="track"><div class="fill" style="width:${Math.round(ratio * 100)}%"></div></div>
      <span class="pct">${Math.round(ratio * 100)}%</span>
      <span class="of">${doneN} of ${totalN} task(s) committed</span>
    </div>`;

  // Committed tasks and an approved item are different facts. B-033 shows 5 of 5
  // committed while `implement` ended FAIL and a gate still holds it — a bar reading
  // 100% with nothing beside it says the work is done, and it is not.
  const marks = [];
  const gates = (detail && detail.blocking) || [];
  gates.forEach(b => {
    marks.push(`<span class="chip wall">${escapeHtml(b.phase)} still holds it: ${escapeHtml(b.verdict)}</span>`);
  });
  // The last verdict, unless a gate above already named that same phase and verdict.
  // "Implement → FAIL" beside "implement still holds it: FAIL" is one fact twice.
  const named = gates.some(b => b.phase === it.phase &&
    String(b.verdict).toUpperCase() === String(it.last_verdict).toUpperCase());
  if (it.last_verdict && !named) {
    const v = String(it.last_verdict).toUpperCase();
    const tone = GOOD_VERDICTS.has(v) ? "good" : BAD_VERDICTS.has(v) ? "bad" : "";
    marks.push(`<span class="chip verdict ${tone}">${escapeHtml(PHASE_LABEL[it.phase] || it.phase)} → ${escapeHtml(it.last_verdict)}</span>`);
  }
  if (it.blockers && it.blockers.length) {
    marks.push(`<span class="chip wall">waits on ${it.blockers.join(", ")}</span>`);
  }
  const marksHtml = marks.length ? `<div class="impl-marks">${marks.join("")}</div>` : "";

  const who = detail && detail.specialist
    ? `${escapeHtml(detail.domain || "")} · ${escapeHtml(detail.specialist)}`
    : escapeHtml(it.domain || "");

  return `<article class="impl-item" data-item="${it.id}">
      <div class="impl-head">
        <div class="line1">
          <span class="iid">${it.id}</span>
          <span class="ttl">${escapeHtml(it.title || "")}</span>
          <span class="who">${who}</span>
        </div>
        <span class="slug">${escapeHtml((detail && detail.slug) || it.plan_slug || "")} · ${escapeHtml(where)}</span>
        ${bar}${marksHtml}
      </div>
      ${body}
    </article>`;
}

function renderImplementation(items) {
  if (!items.length) {
    el("board").innerHTML = `<div class="impl"><span class="none">No item has a plan on
      disk right now. This view is built from the plan and the progress file the cycle
      writes, so it stays empty rather than drawing steps nobody has taken.</span></div>`;
    return;
  }
  // What is being built now comes first; the rest is ordered by id.
  const ordered = [...items].sort((a, b) => {
    const rank = it => it.running_phase ? 0 : it.phase === "implement" ? 1 : hasSettled(it) ? 3 : 2;
    return rank(a) - rank(b) || a.id.localeCompare(b.id);
  });
  ordered.forEach(fetchDetail);
  el("board").innerHTML = `<div class="impl">${ordered.map(implBlock).join("")}</div>`;
}


// ── filter wiring ────────────────────────────────────────────────────────────

el("q").addEventListener("input", e => {
  QUERY = e.target.value.trim().toLowerCase();
  if (LAST_STATE) render(LAST_STATE);
});
el("dom").addEventListener("change", e => {
  DOMAIN = e.target.value;
  if (LAST_STATE) render(LAST_STATE);
});
document.querySelectorAll(".seg button").forEach(btn => {
  btn.addEventListener("click", () => {
    SCOPE = btn.dataset.scope;
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    if (LAST_STATE) render(LAST_STATE);
  });
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


// ── the item panel ───────────────────────────────────────────────────────────
// Fetched per item rather than folded into the board payload: this registry holds
// 167 items, and reading every plan and progress file up front would spend the whole
// page budget on detail nobody asked to see.

const TASK_CLASS = {
  // `committed` first because it is the one this cycle actually writes: without it
  // every finished task in every plan was drawn as neutral, which reads as pending.
  committed: "done", merged: "done",
  done: "done", completed: "done", passed: "done",
  running: "running", in_progress: "running", active: "running",
  blocked: "blocked", failed: "blocked", error: "blocked",
};

function taskClass(status) {
  return TASK_CLASS[String(status || "").toLowerCase()] || "";
}


function section(title, count, inner, emptyText) {
  const head = `<h3>${title}${count !== null ? ` <span class="count">${count}</span>` : ""}</h3>`;
  return `<div class="psec">${head}${inner || `<div class="pempty">${emptyText}</div>`}</div>`;
}

function renderPanel(detail) {
  el("p-id").textContent = detail.id;
  el("p-slug").textContent = detail.slug || "no plan slug on disk";

  // Tasks grouped under the plan's own phases. A task whose phase the plan does not
  // name still shows — dropping it would hide work because a heading was worded
  // differently.
  const byPhase = new Map();
  (detail.tasks || []).forEach(t => {
    const k = t.phase || "?";
    if (!byPhase.has(k)) byPhase.set(k, []);
    byPhase.get(k).push(t);
  });
  const phaseTitle = new Map((detail.phases || []).map(p => [p.key, p.title]));
  const keys = [...new Set([...phaseTitle.keys(), ...byPhase.keys()])].sort();

  const plan = `<div class="pboard">` + keys.map(k => {
    const tasks = byPhase.get(k) || [];
    const rows = tasks.map(t => `
      <div class="ptask ${taskClass(t.status)}">
        <div class="trow">
          <span class="tid">${t.id || "?"}</span>
          <span class="tstat">${escapeHtml(t.status || "?")}</span>
        </div>
        <span class="tfiles" title="${escapeHtml((t.files || []).join(", "))}">${
          escapeHtml((t.files || []).map(f => f.split("/").pop()).join(", ") || "—")}</span>
        ${t.commit ? `<span class="tcommit">${escapeHtml(String(t.commit).slice(0, 9))}${
          t.iterations ? ` · ${t.iterations} iter` : ""}</span>` : ""}
      </div>`).join("") || `<div class="pempty">no tasks</div>`;
    return `<div class="pphase">
        <div class="pphase-head"><span class="num">${k}</span>
          <span class="name">${escapeHtml(phaseTitle.get(k) || "unnamed phase")}</span></div>
        ${rows}
      </div>`;
  }).join("") + `</div>`;

  const artefacts = (detail.artefacts || []).map(a => `
    <div class="part"><span class="pph">${a.phase}</span>
      <span class="ppath" title="${escapeHtml(a.path)}">${escapeHtml(a.name)}</span></div>`).join("");

  // Newest first, and every one: the card shows a single verdict, and this item ended
  // code-quality ten times — one FAIL_SOFT hides that it was iterating, not advancing.
  const verdicts = (detail.verdicts || []).slice().reverse().map(v => {
    const cls = BAD_VERDICTS.has(v.verdict) ? "bad" : GOOD_VERDICTS.has(v.verdict) ? "good" : "";
    return `<div class="pverdict ${cls}"><span class="pph">${v.phase}</span>
      <span class="pv">${escapeHtml(v.verdict || "—")}</span>
      <span class="pwhen">${clock(v.at)}</span></div>`;
  }).join("");

  const blocking = (detail.blocking || []).map(b => `
    <div class="pblock">The <b>${b.phase}</b> gate last returned <b>${escapeHtml(b.verdict)}</b>.
      Nothing advances past it until a later run of that phase clears it.</div>`).join("");

  // Progress first: it is the one number anyone opens this panel to see.
  const total = (detail.tasks || []).length;
  const done = Math.round((detail.done_ratio || 0) * total);
  const progress = total ? `
    <div class="pprogress">
      <span class="pct">${Math.round((detail.done_ratio || 0) * 100)}%</span>
      <span class="pbar"><i style="width:${(detail.done_ratio || 0) * 100}%"></i></span>
      <span class="frac">${done}/${total} tasks</span>
    </div>` : "";

  // The ASSIGNED specialist, not proof of who ran the last command. Nothing in the
  // stream carries an author, and naming the session that happens to be open would be
  // a guess dressed as a record — so the panel says which it is.
  const owner = detail.domain ? `
    <div class="powner">
      <span class="olabel">specialist</span>
      <span>${escapeHtml(detail.specialist || detail.domain)}</span>
      <span class="onote">assigned by domain · not an execution record</span>
    </div>` : "";

  el("p-body").innerHTML = progress + owner
    + section("blocking now", null, blocking, "no gate is holding this item")
    + section("plan · phases and tasks", (detail.tasks || []).length, plan, "no plan on disk yet")
    + section("artefacts", (detail.artefacts || []).length, artefacts, "nothing written yet")
    + section("every verdict", (detail.verdicts || []).length, verdicts, "no phase has ended");
}

async function openPanel(itemId) {
  const panel = el("panel");
  el("p-id").textContent = itemId;
  el("p-slug").textContent = "loading…";
  el("p-body").innerHTML = "";
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  try {
    const r = await fetch(`/api/item/${itemId}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderPanel(await r.json());
  } catch (e) {
    el("p-slug").textContent = "";
    el("p-body").innerHTML = `<div class="pempty">could not load: ${escapeHtml(String(e))}</div>`;
  }
}

function closePanel() {
  const panel = el("panel");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
}

el("p-close").addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
// Delegated, because the board is re-rendered on every push and per-card listeners
// would be re-attached — or worse, leak — each time.
el("board").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card && card.dataset.item) openPanel(card.dataset.item);
});

// ── the live connection ──────────────────────────────────────────────────────
let source;
function connect() {
  source = new EventSource("/api/stream");
  source.onopen = () => {
    el("dot").classList.add("on");
    el("conn").textContent = "live";
  };
  source.onmessage = (event) => {
    const dot = el("dot");
    dot.classList.remove("pulse");
    void dot.offsetWidth;      // restart the animation on a repeat update
    dot.classList.add("pulse");
    render(JSON.parse(event.data));
  };
  source.onerror = () => {
    el("dot").classList.remove("on");
    el("conn").textContent = "reconnecting";
    // EventSource retries on its own; this only keeps the label honest.
  };
}
connect();

// ── theme ────────────────────────────────────────────────────────────────────
el("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const nowDark = current ? current === "dark" : prefersDark;
  root.setAttribute("data-theme", nowDark ? "light" : "dark");
});
</script>
</body>
</html>
